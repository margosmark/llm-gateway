# Personal LLM Gateway deployment. One explicit private LAN listener; no setup port.
name: personal-llm-gateway
services:
  gateway:
    image: personal-llm-gateway:candidate
    container_name: personal-llm-gateway
    build:
      context: .
      args:
        SOURCE_REVISION: "${SOURCE_REVISION:-unknown}"
        SOURCE_TREE: "${SOURCE_TREE:-unknown}"
    network_mode: host
    restart: unless-stopped
    environment:
      GATEWAY_BIND: "${GATEWAY_BIND:-10.10.11.109}"
      GATEWAY_PORT: "${GATEWAY_PORT:-8765}"
      GATEWAY_DATA_DIR: "/var/lib/gateway"
    volumes:
      - gateway-state:/var/lib/gateway
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,urllib.request; h=os.environ.get('GATEWAY_BIND','127.0.0.1'); p=os.environ.get('GATEWAY_PORT','8765'); sys.exit(0 if urllib.request.urlopen(f'http://{h}:{p}/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
volumes:
  gateway-state:
    name: personal-llm-gateway-state
